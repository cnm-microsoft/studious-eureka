[custom]

; ============================================================
; CMLiussss SUBAPI / subconverter 自定义配置
; 说明：
; 1. 所有传入订阅节点自动进入「⚡ 自动选择」
; 2. 已移除固定节点 AU2222-rsh31mue8j
; 3. url-test 每 300 秒测速
; 4. INI/SUBCONFIG 只负责订阅转换规则与策略组；
;    原 YAML 中的 DNS / fake-ip / sniffer 等 Clash 全局参数
;    不能直接通过 SUBCONFIG INI 完整表达。
; ============================================================

; ---------- 策略组 ----------

custom_proxy_group=🚀 节点选择`select`[]⚡ 自动选择`.*
custom_proxy_group=⚡ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🏠 私有网络`select`[]DIRECT
custom_proxy_group=🔒 国内服务`select`[]DIRECT
custom_proxy_group=🌍 非中国`select`[]🚀 节点选择`[]⚡ 自动选择`[]DIRECT`[]REJECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]⚡ 自动选择`[]DIRECT`[]REJECT

; ---------- 规则 ----------

; 广告拦截
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/BanAD.list,86400

; 私有网络 / 局域网
ruleset=🏠 私有网络,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/LocalAreaNetwork.list,86400
ruleset=🏠 私有网络,[]GEOIP,LAN

; 国内服务
ruleset=🔒 国内服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/ChinaDomain.list,86400
ruleset=🔒 国内服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/ChinaCompanyIp.list,86400
ruleset=🔒 国内服务,[]GEOIP,CN

; 非中国 / 国外服务
ruleset=🌍 非中国,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/ProxyLite.list,86400

; 自定义直连域名
ruleset=🔒 国内服务,[]DOMAIN-SUFFIX,040726.xyz
ruleset=🔒 国内服务,[]DOMAIN-SUFFIX,ruixuan.online
ruleset=🔒 国内服务,[]DOMAIN-SUFFIX,225284.xyz
ruleset=🔒 国内服务,[]DOMAIN-SUFFIX,huamucang.top
ruleset=🔒 国内服务,[]DOMAIN-SUFFIX,zcode-ai.com

; 最终规则
ruleset=🐟 漏网之鱼,[]FINAL

; ---------- 规则生成设置 ----------

enable_rule_generator=true
overwrite_original_rules=true
